spring.application.name=AmaliahBackend
server.port=8081

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/amaliah_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Payment Gateway Provider ("xendit")
# ==========================================
payment.gateway.provider=${PAYMENT_GATEWAY_PROVIDER:xendit}

# Xendit Configuration (Loaded securely from Environment Variables or .env)
xendit.secret-key=${XENDIT_SECRET_KEY:}
xendit.api-url=${XENDIT_API_URL:https://api.xendit.co}
xendit.webhook-token=${XENDIT_WEBHOOK_TOKEN:amaliah_xendit_webhook_token_2026}
xendit.simulation-enabled=${XENDIT_SIMULATION_ENABLED:true}

# Bank API Integration
bank.api.base-url=http://localhost:9090
bank.api.client-id=CLIENT-AMALIAH-001
bank.api.client-secret=SECRET-AMALIAH-2026-KEY
bank.api.merchant-id=MCH-AMALIAH-001
bank.api.account-number=7711223344

# JWT Security
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000

# Logging
logging.level.id.amaliah.backend=INFO
logging.file.name=logs/amaliah-backend.log

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none

# Actuator Endpoints & Prometheus Metrics
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

# Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.name=reconciliationJob
spring.batch.job.enabled=false

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.bankService.sliding-window-size=10
resilience4j.circuitbreaker.instances.bankService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.bankService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bankService.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.bankService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.bankService.automatic-transition-from-open-to-half-open-enabled=true

# Google OAuth 2.0 Credentials (Loaded from environment variables)
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}

# Storage Configuration
storage.upload-dir=${STORAGE_UPLOAD_DIR:/opt/amaliah_project/storage/uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB


