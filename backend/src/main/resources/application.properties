spring.application.name=MaunBackend
server.port=8081

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/maun_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Bank API Integration (BI-SNAP - Bank Simulator / Production Bank Endpoint)
bank.api.base-url=http://localhost:9090
bank.api.client-id=CLIENT-MAUN-001
bank.api.client-secret=SECRET-MAUN-2026-KEY
bank.api.merchant-id=MCH-MAUN-001
bank.api.account-number=7711223344

# JWT Security
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000

# Logging
logging.level.id.maun.backend=INFO
logging.file.name=logs/backend.log

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none

# Actuator Endpoints & Prometheus Metrics
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

# Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.name=reconciliationJob
spring.batch.job.enabled=false

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.bankService.sliding-window-size=10
resilience4j.circuitbreaker.instances.bankService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.bankService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bankService.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.bankService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.bankService.automatic-transition-from-open-to-half-open-enabled=true

