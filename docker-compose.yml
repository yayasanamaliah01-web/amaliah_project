services:
  # ==========================================
  # 1. Database - PostgreSQL
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: amaliah-postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: amaliah_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d amaliah_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - amaliah-network

  # ==========================================
  # 2. Object Storage - Garage S3
  # ==========================================
  garage:
    image: dxflrs/garage:v1.0.1
    container_name: amaliah-garage
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3902:3902"
      - "127.0.0.1:3903:3903"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks:
      - amaliah-network

  # ==========================================
  # 3. Backend - Spring Boot (JDK 21)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amaliah-backend
    restart: unless-stopped
    mem_limit: 1024m
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/amaliah_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root}
      SERVER_PORT: 8081
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-784393382981-temgp6dgtrvecfad5lof5b9kssu4vcdk.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      STORAGE_UPLOAD_DIR: /opt/amaliah_project/storage/uploads
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-amaliah-uploads}
      S3_REGION: ${S3_REGION:-garage}
      S3_PUBLIC_URL_PREFIX: ${S3_PUBLIC_URL_PREFIX:-/storage/}
      PAYMENT_GATEWAY_PROVIDER: ${PAYMENT_GATEWAY_PROVIDER:-xendit}
      XENDIT_SECRET_KEY: ${XENDIT_SECRET_KEY:-}
      XENDIT_API_URL: ${XENDIT_API_URL:-https://api.xendit.co}
      XENDIT_WEBHOOK_TOKEN: ${XENDIT_WEBHOOK_TOKEN:-amaliah_xendit_webhook_token_2026}
      XENDIT_SIMULATION_ENABLED: ${XENDIT_SIMULATION_ENABLED:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Yayasan Amaliah <onboarding@resend.dev>}
    ports:
      - "8081:8081"
    volumes:
      - ./storage/uploads:/opt/amaliah_project/storage/uploads
      - ./backend/logs:/app/logs
    networks:
      - amaliah-network

  # ==========================================
  # 4. Frontend - React (Vite + Nginx Alpine)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_BANK_SIM_URL: /api/v1
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-784393382981-temgp6dgtrvecfad5lof5b9kssu4vcdk.apps.googleusercontent.com}
    container_name: amaliah-frontend
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - backend
      - garage
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - amaliah-network

  # ==========================================
  # 5. Grafana Loki - Log Aggregation System
  # ==========================================
  loki:
    image: grafana/loki:3.0.0
    container_name: amaliah-loki
    profiles: ["monitoring"]
    mem_limit: 384m
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - amaliah-network

  # ==========================================
  # 6. Promtail - Log Shipper & Collector
  # ==========================================
  promtail:
    image: grafana/promtail:3.0.0
    container_name: amaliah-promtail
    profiles: ["monitoring"]
    mem_limit: 128m
    volumes:
      - ./infra/monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./backend/logs:/var/log/app:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - amaliah-network

  # ==========================================
  # 7. Prometheus - Metrics Monitoring Engine
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: amaliah-prometheus
    profiles: ["monitoring"]
    mem_limit: 384m
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - amaliah-network

  # ==========================================
  # 8. Grafana - Visualization & Dashboards
  # ==========================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: amaliah-grafana
    profiles: ["monitoring"]
    mem_limit: 256m
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - amaliah-network

  # ==========================================
  # 9. Jenkins - CI/CD Pipeline Automation
  # ==========================================
  jenkins:
    build:
      context: ./infra/jenkins
      dockerfile: Dockerfile
    container_name: amaliah-jenkins
    profiles: ["cicd"]
    mem_limit: 1536m
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Xms256m -Xmx768m"
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - ./infra/jenkins/init.groovy.d/basic-security.groovy:/var/jenkins_home/init.groovy.d/basic-security.groovy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - amaliah-network

networks:
  amaliah-network:
    driver: bridge

volumes:
  postgres_data:
  garage_meta:
  garage_data:
  loki_data:
  prometheus_data:
  grafana_data:
  jenkins_data:
